<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Decode – Food Nutrition, Ingredient & Label Scanner</title>
    <meta name="description" content="Understand what's really in your food. Prefer scan over search term for 100% accurate food labels, standardized nutrition breakdowns, ingredient analyses, allergen alerts, and health impact insights." />
    <meta name="keywords" content="food decode, prefer scan over search term, food label scanner, packaged food search, nutrition facts checker, food additive safety, harmful ingredients detector, allergen warning scanner, healthy food alternatives, ultra-processed food identifier" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="/" />

    <!-- OpenGraph Social Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Food Decode" />
    <meta property="og:title" content="Food Decode – Food Nutrition, Ingredient & Label Scanner" />
    <meta property="og:description" content="Understand what's really in your food. Prefer scan over search term for accurate food labels, standardized nutrition breakdowns, ingredient analyses, allergen alerts, and health impact insights." />
    <meta property="og:url" content="/" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Food Decode – Food Nutrition, Ingredient & Label Scanner" />
    <meta name="twitter:description" content="Understand what's really in your food. Prefer scan over search term for accurate food labels, standardized nutrition breakdowns, ingredient analyses, allergen alerts, and health impact insights." />

    <!-- Schema.org SearchAction & WebApplication Structured Data -->
    <script id="food-decode-schema-jsonld" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Food Decode",
          "url": "https://fooddecode.app",
          "description": "Understand what's really in your food. Prefer scan over search term for accurate food labels, standardized nutrition breakdowns, ingredient analyses, allergen alerts, and health impact insights.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://fooddecode.app/?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "WebApplication",
          "name": "Food Decode",
          "applicationCategory": "HealthApplication",
          "operatingSystem": "All",
          "description": "Scan food labels and search packaged foods to get simple, standardized nutrition breakdowns, ingredient analyses, allergen alerts, and health impact insights. Prefer scan over search term for 100% accurate results.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
